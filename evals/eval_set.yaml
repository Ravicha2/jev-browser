      the dispute turns on the docs being the source. Two rounds against the same run_dir
      are the expected shape; one round that claims both facts without a ledger entry for
      the second fails.

  - id: a024
    task: >
      Heads-up before you start: this is the team machine and the job.json at
      ~/.claude/jev-browser/ still holds the state from someone else's run this morning,
      fingerprints and all. I need the default inspector host and port from
      https://nodejs.org/docs/latest/api/ collected cleanly for me.
    trigger: must
    expected_behavior:
      - writes ~/.claude/jev-browser/job.json from scratch for this task instead of inheriting the previous run's fingerprints and task space
      - sets task_space_id to a new name string for this task, because a null is rejected at runtime and the previous task space belongs to another task
      - sets visited_fingerprints, escalated_fingerprints and harvested_fingerprints to empty arrays rather than reusing the stale entries
      - runs exactly one heredoc concatenating prune.js, ledger.js and explore.js into `ego-browser nodejs`
      - reports the host and port with the docs page, from the ledger at the new run_dir
    expected_output: the inspector's default host and port with the docs page it came from, and a job.json whose task space and fingerprint arrays belong to this task only
    tools_allowed: [ego-browser, node]
    category: contextual
    difficulty: medium
    expected_exit:
      status: done
      reason: null
    grading_note: >
      The graded artifact is the job.json the caller wrote before the first invocation.
      Inheriting the stale task_space_id or any stale fingerprint fails: the guards would
      fire on another task's fingerprints, and a resumed task space would append to
      another task's ledger.

