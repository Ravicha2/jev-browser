      about twenty minutes. Start from https://nodejs.org/docs/latest/api/ .
    trigger: must
    expected_behavior:
      - writes job.json with a goal naming both facts, start_url the docs index, step_budget 12, and runs exactly one heredoc with explore.js
      - accepts the docs pages as the source and does not substitute a third-party page, a search result page or a model-written answer
      - if the first round's ledger holds only one of the two facts, which is what one span per extraction round means, re-invokes with the same task_space_id and run_dir for the second
      - reports both facts with the docs page each came from, and states plainly if one of them was not found
    expected_output: the maxBuffer default and the exceeded behavior, each with the docs page that states it
    tools_allowed: [ego-browser, node]
    category: contextual
    difficulty: medium
    grading_note: >
